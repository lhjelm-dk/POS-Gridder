# A pull request runs the unit tests; a push to main runs everything, app renders included,
# on both supported Pythons. Same split as HCWC Builder.
name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ github.event_name == 'push' && fromJSON('["3.11", "3.12"]') || fromJSON('["3.12"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Unit tests (pull request)
        if: github.event_name == 'pull_request'
        run: pytest -q -m "not render"
      - name: Full suite, renders included (main)
        if: github.event_name == 'push'
        run: pytest -q
